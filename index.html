<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#05070a"
    >

    <title>SPIDER-AI V3</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- CAMERA -->
    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>


    <!-- HUD -->
    <div id="hud">

        <!-- TOP -->
        <div class="top-bar">

            <div class="brand">
                SPIDER-AI
                <span>V3</span>
            </div>

            <div
                id="systemStatus"
                class="status"
            >
                OFFLINE
            </div>

        </div>


        <!-- INFO -->
        <div class="top-info">

            <div class="info-card">

                <div class="label">
                    BATTERY
                </div>

                <div
                    id="battery"
                    class="value"
                >
                    --
                </div>

            </div>


            <div class="info-card">

                <div class="label">
                    FPS
                </div>

                <div
                    id="fps"
                    class="value"
                >
                    --
                </div>

            </div>


            <div class="info-card">

                <div class="label">
                    CAMERA
                </div>

                <div
                    id="cameraStatus"
                    class="value"
                >
                    OFF
                </div>

            </div>

        </div>


        <!-- RETICLE -->
        <div id="reticle">

            <div class="reticle-line top"></div>
            <div class="reticle-line bottom"></div>
            <div class="reticle-line left"></div>
            <div class="reticle-line right"></div>

            <div class="reticle-center"></div>

        </div>


        <!-- CURRENT OBJECT -->
        <div
            id="objectDisplay"
            class="object-display"
        >

            <div
                id="objectName"
                class="object-name"
            >
                NO TARGET
            </div>

            <div
                id="objectConfidence"
                class="object-confidence"
            >
                --

            </div>

        </div>


        <!-- BOTTOM -->
        <div class="bottom-panel">

            <div class="metric">

                <div class="metric-label">
                    DISTANCE
                </div>

                <div
                    id="distance"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-label">
                    HEADING
                </div>

                <div
                    id="heading"
                    class="metric-value"
                >
                    --
                </div>

            </div>


            <div class="metric">

                <div class="metric-label">
                    OBJECT
                </div>

                <div
                    id="tracking"
                    class="metric-value"
                >
                    OFF
                </div>

            </div>


            <div class="metric">

                <div class="metric-label">
                    MODE
                </div>

                <div
                    id="mode"
                    class="metric-value"
                >
                    BASIC
                </div>

            </div>


            <button
                id="startButton"
                class="start-button"
            >
                START SPIDER-AI
            </button>

        </div>


        <div
            id="statusMessage"
            class="status-message"
        >
            SYSTEM READY
        </div>

    </div>


    <!-- AI LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>


    <!-- SPIDER-AI -->
    <script src="vision.js"></script>

    <script src="app.js"></script>

</body>

</html>
